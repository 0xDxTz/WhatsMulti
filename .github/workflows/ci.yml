name: CI

on:
    push:
        branches: [main, v2]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    spec:
        name: Spec integrity
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            # Generated code must match spec/. A hand-edit here would silently
            # redefine the contract the Go implementation is held to.
            - name: Generated code is up to date
              run: npm run gen:check

            # Any change under spec/ requires a spec/VERSION bump. Vectors are
            # deliberately never regenerated in CI.
            - name: spec/VERSION bumped when spec changed
              if: github.event_name == 'pull_request'
              run: |
                  base="origin/${{ github.base_ref }}"
                  git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
                  if git diff --quiet "$base" -- spec/; then
                    echo "spec/ unchanged"
                    exit 0
                  fi
                  if git diff --quiet "$base" -- spec/VERSION; then
                    echo "::error::spec/ changed but spec/VERSION was not bumped"
                    exit 1
                  fi
                  echo "spec/VERSION bumped"

    check:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test
            - run: npm run build

    bun:
        name: Bun
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bunx vitest run

    package:
        name: Package shape
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build

            # publint catches a malformed exports map; attw catches the type
            # resolution problems that only surface for consumers.
            #
            # `--pack npm` is not cosmetic: publint picks its packer from whichever
            # lockfile it finds, and bun.lock is committed here for the Bun job. This
            # runner has no bun, so the default detection crashes with `spawn bun
            # ENOENT` before it lints anything. npm is what actually publishes this
            # package, so npm is what should pack it for inspection.
            #
            # The esm-only profile is the honest one: v2 is ESM-only on Node >= 20,
            # so a CJS consumer reaching dynamic-import-only is the documented
            # outcome, and node10 resolution -- which cannot read an exports map at
            # all, and so cannot see the ./qr subpath -- is not a target.
            - run: npx publint --pack npm
            - run: npx attw --pack . --profile esm-only

            # typedoc runs with treatWarningsAsErrors, so this fails on a broken link
            # or on a public signature that references a type nothing exports -- both
            # of which a consumer hits before we would.
            - run: npm run docs

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run coverage

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 7

    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run format:check
